# Input, output, and pipeline parameters for `python -m src`.
# Paths are relative to the repository root.

[raw]
permits = data/raw/geojson/Nashville_Building_Permit_Applications.geojson
clinics = data/raw/geojson/Public_Health_Clinics.geojson
districts = data/raw/geojson/TN_Congressional_Districts.geojson
districts_csv = data/raw/csv/TN_Congressional_Districts.csv

[processed]
permits = data/processed/geojson/Nashville_Building_Permit_Applications.geojson
districts_csv = data/processed/csv/TN_Congressional_Districts.csv

[reports]
map = reports/figures/nashville_map.html

[parameters]
# Maximum permit features written to the processed file and drawn on the map.
permit_limit = 100
# Optional: keep only permits whose property equals this value. Leave both empty to keep all.
permit_filter_property =
permit_filter_value =
